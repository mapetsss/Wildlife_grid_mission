d435_camera_node:
  ros__parameters:
    serial_no: ""

    # RGB-only 模式只启用 D435 彩色传感器，不启动深度流和红外投射器。
    enable_color: true
    color_width: 640
    color_height: 480
    color_fps: 30

    enable_depth: false
    depth_width: 640
    depth_height: 480
    depth_fps: 30
    align_depth_to_color: false
    enable_emitter: false
    laser_power: -1.0

    color_frame_id: "camera_color_optical_frame"
    depth_frame_id: "camera_depth_optical_frame"
    publish_camera_info: true
    log_fps: true
    reconnect_on_failure: true
    reconnect_period_ms: 1000
    frame_timeout_ms: 1000
